version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: rojgarnext_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - rojgarnext_network
    command: mongod --bind_ip_all

  redis:
    image: redis:7.2-alpine
    container_name: rojgarnext_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rojgarnext_network
    command: redis-server --appendonly yes

  backend:
    build: ./backend/rojgarnext
    container_name: rojgarnext_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/rojgarnext/.env
    volumes:
      - ./backend/rojgarnext:/app
      - backend_uploads:/app/uploads
      - backend_secure:/app/secure
      - backend_models:/app/models
    depends_on:
      - mongodb
      - redis
    networks:
      - rojgarnext_network
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/rojgarnext}
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production

  nginx:
    build: ./frontend/rojgarnext
    container_name: rojgarnext_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - rojgarnext_network

networks:
  rojgarnext_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  backend_uploads:
  backend_secure:
  backend_models:
  nginx_logs: