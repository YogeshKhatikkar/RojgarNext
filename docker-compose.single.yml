version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: rojgarnext_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - rojgarnext_network
    command: mongod --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: rojgarnext_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rojgarnext_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend/rojgarnext
      dockerfile: Dockerfile
    container_name: rojgarnext_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/rojgarnext/.env
    volumes:
      - ./backend/rojgarnext:/app
      - backend_uploads:/app/uploads
      - backend_secure:/app/secure
      - backend_models:/app/models
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rojgarnext_network
    environment:
      - MONGO_URI=mongodb://mongodb:27017/rojgarnext
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production

  # Nginx with Flutter Web
  nginx:
    build:
      context: ./frontend/rojgarnext
      dockerfile: Dockerfile
    container_name: rojgarnext_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - rojgarnext_network

networks:
  rojgarnext_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_secure:
    driver: local
  backend_models:
    driver: local
  nginx_logs:
    driver: local