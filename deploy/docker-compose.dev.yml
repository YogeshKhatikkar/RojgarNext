version: '3.9'

services:
  mongo:
    image: mongo:7.0
    container_name: rojgarnext_mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_DATABASE: rojgarnext
    volumes:
      - mongo_data:/data/db
    networks: [rojgarnext_net]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/rojgarnext --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: rojgarnext_redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks: [rojgarnext_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend/rojgarnext
      dockerfile: Dockerfile.dev
    container_name: rojgarnext_backend
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file:
      - ../backend/rojgarnext/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/rojgarnext
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
    volumes:
      - ../backend/rojgarnext:/app
      - backend_uploads:/app/uploads
      - backend_models:/app/models
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [rojgarnext_net]

  frontend:
    build:
      context: ../frontend/rojgarnext
      dockerfile: Dockerfile.dev
    container_name: rojgarnext_frontend
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes:
      - ../frontend/rojgarnext:/app
    environment:
      API_BASE_URL: http://localhost:8000
    depends_on: [backend]
    networks: [rojgarnext_net]

  # Nginx optional for local testing reverse proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: rojgarnext_nginx
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    networks: [rojgarnext_net]

volumes:
  mongo_data:
  redis_data:
  backend_uploads:
  backend_models:

networks:
  rojgarnext_net:
    driver: bridge