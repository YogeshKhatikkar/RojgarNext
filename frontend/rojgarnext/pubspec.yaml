name: rojgarnext
description: "RojgarNext - Ultimate Job Portal Platform"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.0
  dio: ^5.4.0
  http: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  file_picker: ^8.3.0
  path_provider: ^2.1.0
  http_parser: ^4.0.0
  path: ^1.9.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  pin_code_fields: ^8.0.0
  cupertino_icons: ^1.0.8
  geolocator: ^10.1.1
  permission_handler: ^11.0.0
  device_info_plus: ^9.1.0
  go_router: ^17.3.0
  url_launcher: ^6.2.0
  flutter_pdfview: ^1.3.0
  open_file: ^3.3.0
  webview_flutter: ^4.10.0
  lottie: ^3.3.0
  fl_chart: ^1.2.0
  local_auth: ^2.1.0
  
  # Payment - Works on both Web and Mobile
  razorpay_flutter: ^1.3.4
  
  # QR Code
  qr_flutter: ^4.0.0
  
  # PDF Generation
  printing: ^5.11.0
  pdf: ^3.10.0
  
  # Responsive
  responsive_builder: ^0.7.0

  # JS Interop - Safe with conditional imports
  js: ^0.6.7
  
  # Connectivity
  connectivity_plus: ^7.2.0
  
  # Universal IO (safe on all platforms)
  universal_io: ^2.0.0

  flutter_widget_from_html: ^0.15.0
  webview_flutter_web: ^0.2.2
  
  # REMOVED: web: ^1.1.1 - This package conflicts with dart:js and dart:js_util

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#1E3A8A"
  android: true
  ios: true
  web: true

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#1E3A8A"